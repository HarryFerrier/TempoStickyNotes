name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    name: Lint, type-check, test and e2e
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check and build
        run: npm run build

      - name: Unit and component tests
        run: npm test

      # Ubuntu runners ship with Google Chrome, which the Playwright config uses.
      - name: End-to-end tests
        run: npm run e2e

      - name: Keep the Playwright report when e2e fails
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
